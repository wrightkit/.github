name: Crate Release

on:
  workflow_call:
    inputs:
      required-check-runs:
        description: Comma-separated check-run names that must succeed on the release revision before publication
        required: true
        type: string
    outputs:
      releases:
        description: JSON metadata for releases created by release-plz
        value: ${{ jobs.release.outputs.releases }}
      releases_created:
        description: Whether release-plz created any release
        value: ${{ jobs.release.outputs.releases_created }}
    secrets:
      github-token:
        description: Token used by release-plz for repository operations
        required: true
      cargo-registry-token:
        description: Optional crates.io token passed by callers without a release environment secret
        required: false
      CARGO_REGISTRY_TOKEN:
        description: Crates.io token resolved from the release environment, preferred over cargo-registry-token
        required: false

jobs:
  package-preflight:
    name: Verify publishable package artifacts
    if: github.repository_owner == 'wrightkit'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Rust
        uses: wrightkit/.github/.github/actions/setup-rust@main

      - name: Verify publishable packages
        run: cargo publish --workspace --locked --dry-run

  release-ci-gate:
    name: Wait for release-revision CI
    if: github.repository_owner == 'wrightkit'
    needs: package-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 100
    permissions:
      checks: read
    steps:
      - name: Wait for required checks on the release revision
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUIRED_CHECK_RUNS: ${{ inputs.required-check-runs }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          sha="${{ github.sha }}"
          deadline=$(( SECONDS + 5400 ))
          pending_file=$(mktemp)
          trap 'rm -f "$pending_file"' EXIT
          if [ "$REQUIRED_CHECK_RUNS" != "${REQUIRED_CHECK_RUNS//$'\n'/,}" ]; then
            echo "required-check-runs must be a single comma-separated line" >&2
            exit 1
          fi
          IFS=',' read -r -a names <<< "$REQUIRED_CHECK_RUNS"
          count=0
          for raw in "${names[@]}"; do
            name="$(echo "$raw" | xargs)"
            if [ -n "$name" ]; then
              printf '%s\n' "$name" >> "$pending_file"
              count=$(( count + 1 ))
            fi
          done
          if [ "$count" -eq 0 ]; then
            echo "required-check-runs resolved to an empty set; refusing to publish without a named gate" >&2
            exit 1
          fi
          while [ -s "$pending_file" ]; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "Timed out waiting for release-revision checks:" >&2
              cat "$pending_file" >&2
              exit 1
            fi
            sleep 30
            keep=""
            while IFS= read -r name; do
              [ -z "$name" ] && continue
              if ! out=$(gh api --method GET "repos/$repo/commits/$sha/check-runs" -f "check_name=$name" \
                --jq '(.check_runs | sort_by(.id) | last) // {status: "missing", conclusion: "", html_url: ""} | "\(.status) \(.conclusion // "-") \(.html_url // "-")"' 2>&1); then
                echo "check-runs API call failed for '$name': $out" >&2
                exit 1
              fi
              status="${out%% *}"
              rest="${out#* }"
              conclusion="${rest%% *}"
              case "$status" in
                completed)
                  if [ "$conclusion" = "success" ]; then
                    echo "PASS $name"
                  else
                    echo "FAIL $name concluded '$conclusion' ($out)" >&2
                    exit 1
                  fi ;;
                *)
                  keep="${keep}${name}"$'\n'
                  echo "WAIT $name ($status)" ;;
              esac
            done < "$pending_file"
            printf '%s' "$keep" > "$pending_file"
          done
          echo "All required checks succeeded on $sha"

  release:
    name: Publish crates and create release tag
    if: github.repository_owner == 'wrightkit'
    needs: [package-preflight, release-ci-gate]
    outputs:
      releases: ${{ steps.release-plz.outputs.releases }}
      releases_created: ${{ steps.release-plz.outputs.releases_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    concurrency:
      group: wrightkit-release-plz-publication
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.github-token }}

      - name: Publish unpublished crates
        id: release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9
        with:
          command: release
          version: "0.3.160"
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.cargo-registry-token }}

  release-pr:
    name: Maintain release PR
    if: github.repository_owner == 'wrightkit'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: wrightkit-release-plz-pr-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.github-token }}

      - name: Update release PR
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9
        with:
          command: release-pr
          version: "0.3.160"
        env:
          GITHUB_TOKEN: ${{ secrets.github-token }}
